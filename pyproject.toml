[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-llm-cli"
version = "0.1.0"
description = "Personal provider-agnostic LLM CLI"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "httpx",
]

[project.scripts]
llm = "x.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["x*"]
